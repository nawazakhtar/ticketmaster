spring.application.name=ticketmaster

spring.datasource.url=jdbc:postgresql://localhost:5499/ticketmaster

spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

server.port=6060

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.elasticsearch.uris=http://localhost:9200

app.sqs.booking-confirmed-queue=Ticketmaster

# Values come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env, loaded
# as real process env vars by the IDE run configuration - never hardcode keys
# into this file.
spring.cloud.aws.region.static=eu-north-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Default is CREATE, which tries sqs:CreateQueue on every queue-name lookup -
# the queue already exists and the IAM user is deliberately not granted
# CreateQueue (least privilege), so just look it up and fail loudly if it's
# ever actually missing rather than silently trying to create one.
spring.cloud.aws.sqs.queue-not-found-strategy=fail
